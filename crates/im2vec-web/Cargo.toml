[package]
name = "im2vec-web"
version = "0.1.0"
edition = "2021"

[dependencies]
im2vec-core = { path = "../im2vec-core" }
im2vec-flat = { path = "../im2vec-flat" }
anyhow = "1"
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
